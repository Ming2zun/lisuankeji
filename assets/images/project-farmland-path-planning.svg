<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Farmland path planning cover</title>
  <desc id="desc">A precision agriculture field with coverage path planning lanes, turning routes, waypoint markers, and ROS2 topic output.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="0.48" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bef264"/>
      <stop offset="1" stop-color="#33ccff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="soil" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M0 24H46" stroke="#bbf7d0" stroke-opacity="0.08" stroke-width="9"/>
    </pattern>
  </defs>
  <rect width="1200" height="720" fill="#020617"/>
  <path d="M86 92h762l118 468H156z" fill="url(#field)" stroke="#86efac" stroke-opacity="0.28" stroke-width="3"/>
  <path d="M86 92h762l118 468H156z" fill="url(#soil)"/>
  <g fill="none" stroke="url(#route)" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
    <path d="M180 510H828c34 0 58-24 58-56s-24-56-58-56H224c-34 0-58-24-58-56s24-56 58-56h570c34 0 58-24 58-56s-24-56-58-56H214"/>
    <path d="M214 174c-32 0-56-22-56-52"/>
  </g>
  <g fill="#e0f2fe" opacity="0.95">
    <circle cx="180" cy="510" r="10"/>
    <circle cx="828" cy="510" r="10"/>
    <circle cx="224" cy="398" r="10"/>
    <circle cx="794" cy="286" r="10"/>
    <circle cx="214" cy="174" r="10"/>
  </g>
  <g transform="translate(742 414) rotate(-7)">
    <rect x="-34" y="-20" width="86" height="44" rx="10" fill="#e0f2fe"/>
    <rect x="-16" y="-42" width="42" height="34" rx="6" fill="#38bdf8"/>
    <circle cx="-18" cy="28" r="12" fill="#0f172a"/>
    <circle cx="30" cy="28" r="12" fill="#0f172a"/>
    <path d="M52 2l58-18" stroke="#bef264" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g transform="translate(896 104)">
    <rect width="268" height="430" rx="18" fill="#020617" fill-opacity="0.76" stroke="#86efac" stroke-opacity="0.25"/>
    <text x="24" y="50" fill="#ecfccb" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">FARMLAND PATH</text>
    <text x="24" y="84" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="14">coverage planner / ROS2 topic</text>
    <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#cbd5e1">
      <text x="24" y="146">mode: s_rote / o_rote</text>
      <text x="24" y="200">waypoints: generated</text>
      <text x="24" y="254">coverage: field rows</text>
      <text x="24" y="308">publish: /path_points</text>
    </g>
    <g fill="#bef264">
      <rect x="24" y="160" width="184" height="8" rx="4" opacity="0.78"/>
      <rect x="24" y="214" width="144" height="8" rx="4" opacity="0.78"/>
      <rect x="24" y="268" width="198" height="8" rx="4" opacity="0.78"/>
      <rect x="24" y="322" width="158" height="8" rx="4" opacity="0.78"/>
    </g>
    <text x="24" y="388" fill="#33ccff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">ROUTE READY</text>
  </g>
</svg>
